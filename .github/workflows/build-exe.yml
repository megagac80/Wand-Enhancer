name: Build PowerShell Executable
on:
  workflow_dispatch: # Allows manual trigger with one click

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Run Build Script
        shell: pwsh
        run: |
          ./build.ps1

      - name: Upload Finished Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-application
          path: |
            *.exe
            dist/**/*.exe
            build/**/*.exe
            out/**/*.exe
            bin/**/*.exe
